services:
  backend:
    build: ./backend/
    container_name: tracker_backend
    restart: always
    ports:
      - 8000:8000
    env_file:
      - .env

    develop:
      watch:
        - action: rebuild
          path: .

  frontend:
    build: ./frontend/
    container_name: tracker_frontend
    restart: always
    ports:
      - 5000:5000
    depends_on:
      - backend
